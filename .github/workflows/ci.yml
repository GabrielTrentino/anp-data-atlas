name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: valida docs + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Ruff
        run: ruff check .
      - name: Coerência datasets.yaml x docs (links internos, seções obrigatórias)
        run: python scripts/validate_docs.py
